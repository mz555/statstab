name: Refresh #statstab and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Runs hourly, away from the top-of-hour rush.
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh Bluesky archive
        env:
          BSKY_HANDLE: mzloteanu.bsky.social
          STATSTAB_HASHTAG: statstab
          STATSTAB_START_DATE: "2024-01-01"
        run: python scripts/fetch_statstabs.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
